name: Publish brand kit to GitHub Pages

# Regenerates the kit from the config and deploys dist/ as the Pages site.
# Runs on every push to main (and can be triggered by hand).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token that the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Rebuild every asset + index.html from brandkit.config.yaml so the
      # published site can never drift from the config. The motion-raster flag
      # also bakes GIF/WebP/APNG for the animations (slow locally, fine in CI)
      # so the Motion cards offer those formats for download.
      - run: npm run generate:motion

      # Bundle downloads served by the site's "Download …" buttons:
      # one everything-zip plus a per-directory zip (logo/apps/stickers/tokens).
      - name: Build download bundles
        working-directory: dist
        run: |
          zip -rq brandkit-all.zip . -x '*.zip'
          for d in logo apps stickers tokens; do
            [ -d "$d" ] && zip -rq "$d.zip" "$d"
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
